name: Materialize approved InvoiceLens source
on:
  push:
    branches: [invoicelens-fullstack]
    paths: [.github/workflows/bootstrap-invoicelens.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'anasamin822-dotcom/InvoiceLens' && github.ref == 'refs/heads/invoicelens-fullstack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: invoicelens-fullstack
      - name: Verify and materialize exact approved files
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/invoicelens-fullstack'
          assert os.environ['GITHUB_REPOSITORY']=='anasamin822-dotcom/InvoiceLens'
