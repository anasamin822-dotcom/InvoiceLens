          compressed=base64.b64decode('',validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='ceddbef5939cfe727ff0cb04ce7ab07e0bd9ec017967d45fad0873fda1c8060d'
          files=json.loads(gzip.decompress(compressed))
          assert set(files)==set(manifest)
          root=pathlib.Path.cwd().resolve()
          for name,expected in manifest.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              target=root.joinpath(*p.parts)
              assert target.resolve().is_relative_to(root)
              assert not target.is_symlink()
              data=base64.b64decode(files[name],validate=True)
              assert hashlib.sha256(data).hexdigest()==expected
          for name in manifest:
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(files[name],validate=True))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Complete InvoiceLens private workspace, extraction and review'],check=True)
          subprocess.run(['git','push','origin','HEAD:invoicelens-fullstack'],check=True)
