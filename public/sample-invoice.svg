<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <style>
      .bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #111827; }
      .regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #4b5563; }
      .semibold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #1f2937; }
      .accent { fill: #4f46e5; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="1100" fill="#ffffff" />
  
  <!-- Subtle Header Bar -->
  <rect x="0" y="0" width="800" height="8" fill="#4f46e5" />

  <!-- Logo and Company Info -->
  <g transform="translate(60, 60)">
    <rect width="40" height="40" rx="8" fill="#4f46e5" />
    <path d="M12 14h16M12 20h12M12 26h8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="56" y="26" class="bold" font-size="22">Apex Logistics Ltd.</text>
    <text x="56" y="44" class="regular" font-size="12">100 Tech Boulevard, Suite 400, San Francisco, CA</text>
  </g>

  <!-- Invoice Meta Box (Right Side) -->
  <!-- Label: Invoice Number -->
  <text x="464" y="80" class="regular" font-size="11" fill="#6b7280" text-transform="uppercase" letter-spacing="1">Invoice Number</text>
  <!-- Value: INV-2041 inside box (x:464, y:88, w:192, h:44) -->
  <rect x="464" y="88" width="192" height="44" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="478" y="116" class="semibold mono" font-size="16" fill="#111827">INV-2041</text>

  <!-- Label: Invoice Date -->
  <text x="464" y="138" class="regular" font-size="11" fill="#6b7280" text-transform="uppercase" letter-spacing="1">Invoice Date</text>
  <!-- Value: 2026-09-14 inside box (x:464, y:143, w:192, h:44) -->
  <rect x="464" y="143" width="192" height="44" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="478" y="171" class="semibold mono" font-size="16" fill="#111827">2026-09-14</text>

  <!-- Divider -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#f1f5f9" stroke-width="2" />

  <!-- Bill To / Ship To -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" class="bold" font-size="12" fill="#6b7280" text-transform="uppercase" letter-spacing="1">Billed To</text>
    <text x="0" y="24" class="bold" font-size="16">Meridian Global Corp</text>
    <text x="0" y="44" class="regular" font-size="13">Attn: Accounts Payable</text>
    <text x="0" y="64" class="regular" font-size="13">742 Evergreen Terrace</text>
    <text x="0" y="84" class="regular" font-size="13">Seattle, WA 98101</text>
  </g>

  <g transform="translate(360, 240)">
    <text x="0" y="0" class="bold" font-size="12" fill="#6b7280" text-transform="uppercase" letter-spacing="1">Payment Terms</text>
    <text x="0" y="24" class="semibold" font-size="14">Net 30 Days</text>
    <text x="0" y="44" class="regular" font-size="13">Due Date: 2026-10-14</text>
    <text x="0" y="64" class="regular" font-size="13">PO Number: PO-89214</text>
  </g>

  <!-- Line Items Table -->
  <g transform="translate(60, 380)">
    <!-- Table Header -->
    <rect x="0" y="0" width="680" height="38" rx="4" fill="#f8fafc" />
    <text x="20" y="24" class="bold" font-size="12" fill="#475569">DESCRIPTION</text>
    <text x="360" y="24" class="bold" font-size="12" fill="#475569" text-anchor="middle">QTY</text>
    <text x="480" y="24" class="bold" font-size="12" fill="#475569" text-anchor="end">UNIT PRICE</text>
    <text x="660" y="24" class="bold" font-size="12" fill="#475569" text-anchor="end">AMOUNT</text>

    <!-- Row 1 -->
    <text x="20" y="70" class="semibold" font-size="14">Enterprise Cloud Hosting (Annual)</text>
    <text x="20" y="88" class="regular" font-size="12" fill="#64748b">Dedicated cluster with 99.99% SLA</text>
    <text x="360" y="76" class="regular" font-size="14" text-anchor="middle">1</text>
    <text x="480" y="76" class="regular mono" font-size="14" text-anchor="end">28,000.00</text>
    <text x="660" y="76" class="semibold mono" font-size="14" text-anchor="end">28,000.00</text>
    <line x1="0" y1="105" x2="680" y2="105" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 2 -->
    <text x="20" y="135" class="semibold" font-size="14">Technical Integration &amp; Security Setup</text>
    <text x="20" y="153" class="regular" font-size="12" fill="#64748b">On-site deployment &amp; IAM configuration</text>
    <text x="360" y="141" class="regular" font-size="14" text-anchor="middle">1</text>
    <text x="480" y="141" class="regular mono" font-size="14" text-anchor="end">12,500.00</text>
    <text x="660" y="141" class="semibold mono" font-size="14" text-anchor="end">12,500.00</text>
    <line x1="0" y1="170" x2="680" y2="170" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 3 -->
    <text x="20" y="200" class="semibold" font-size="14">Premium 24/7 SLA Support Package</text>
    <text x="20" y="218" class="regular" font-size="12" fill="#64748b">Priority escalation with 15min response</text>
    <text x="360" y="206" class="regular" font-size="14" text-anchor="middle">1</text>
    <text x="480" y="206" class="regular mono" font-size="14" text-anchor="end">4,500.00</text>
    <text x="660" y="206" class="semibold mono" font-size="14" text-anchor="end">4,500.00</text>
    <line x1="0" y1="235" x2="680" y2="235" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 4 -->
    <text x="20" y="265" class="semibold" font-size="14">Compliance Audit &amp; Data Governance</text>
    <text x="20" y="283" class="regular" font-size="12" fill="#64748b">SOC 2 Type II audit verification and reporting</text>
    <text x="360" y="271" class="regular" font-size="14" text-anchor="middle">1</text>
    <text x="480" y="271" class="regular mono" font-size="14" text-anchor="end">3,250.00</text>
    <text x="660" y="271" class="semibold mono" font-size="14" text-anchor="end">3,250.00</text>
    <line x1="0" y1="300" x2="680" y2="300" stroke="#f1f5f9" stroke-width="1" />
  </g>

  <!-- Summary Section -->
  <g transform="translate(60, 720)">
    <!-- Subtotal -->
    <text x="440" y="30" class="regular" font-size="13">Subtotal</text>
    <text x="680" y="30" class="regular mono" font-size="14" text-anchor="end">48,250.00</text>

    <!-- Tax -->
    <text x="440" y="60" class="regular" font-size="13">Tax (0%)</text>
    <text x="680" y="60" class="regular mono" font-size="14" text-anchor="end">0.00</text>

    <line x1="440" y1="80" x2="680" y2="80" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <!-- Total Amount Area -->
  <!-- Label above the value box -->
  <text x="380" y="896" class="bold" font-size="16" fill="#1e293b">Total Due (USD)</text>
  <!-- Value box: y=907 → box y=907/1100≈0.825, mock box y updated to match -->
  <rect x="464" y="907" width="192" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="478" y="936" class="bold mono" font-size="20" fill="#4f46e5">48,250.00</text>

  <!-- Footer Notes & Bank Details -->
  <g transform="translate(60, 1000)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#f1f5f9" stroke-width="1" />
    <text x="0" y="28" class="semibold" font-size="12" fill="#475569">Bank Transfer Details</text>
    <text x="0" y="46" class="regular mono" font-size="11" fill="#64748b">Routing: 121000358 | Account: 9840291044 | SWIFT: APEXUS33</text>
    <text x="0" y="64" class="regular" font-size="11" fill="#94a3b8">Thank you for your business. For billing inquiries, contact billing@apexlogistics.io</text>
  </g>
</svg>
